@if (modal.visible()) {
  <div class="modal-backdrop" (click)="modal.dismiss()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <h3 class="modal-title">{{ modal.config().title }}</h3>
      <p class="modal-message">{{ modal.config().message }}</p>
      <div class="modal-actions">
        <button class="btn-outline" (click)="modal.dismiss()">cancel</button>
        <button
          [class]="modal.config().danger ? 'btn-dark danger' : 'btn-dark'"
          (click)="modal.confirm()">
          {{ modal.config().confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
